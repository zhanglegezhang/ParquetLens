[package]
name = "parquetlens"
version = "0.6.0"
description = "Offline Parquet desktop inspector"
authors = ["ParquetLens"]
edition = "2024"

[[bin]]
name = "parquetlens"
path = "src/main.rs"
# The entry point delegates to the library; its tests are in lib/tests.
test = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parquetlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "zstd", "lz4", "brotli"] }
arrow = { version = "60.1.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
num-bigint = "0.5.1"
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
tempfile = "3.27.0"
rayon = "1.12.0"
sha2 = "0.11.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "unwind"
strip = true

[dev-dependencies]
calamine = { version = "0.37.0", features = ["dates"] }
csv = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

